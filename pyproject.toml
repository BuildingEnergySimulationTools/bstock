[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bstock"
version = "0.1.0"
description = "Common data structure for building stocks, with multi-source provenance and metered data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nobatek" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "pyarrow",
]

[project.optional-dependencies]
plot = ["plotly>=5"]
dev = ["pytest>=8", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/bstock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep hand-aligned examples in SPEC.md / PLAN.md

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

ignore = ["D105"]  # magic methods document themselves

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: tests that call real external APIs (RNB, BDNB, DPE)",
]
filterwarnings = ["error::DeprecationWarning:bstock.*"]
